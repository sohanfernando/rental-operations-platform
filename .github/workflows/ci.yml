name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: mysql://rental:ci-rental-password@127.0.0.1:13306/rental_operations_test
      TEST_REDIS_URL: redis://127.0.0.1:16379
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rental_operations_test
          MYSQL_USER: rental
          MYSQL_PASSWORD: ci-rental-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - '13306:3306'
        options: >-
          --health-cmd "MYSQL_PWD=ci-rental-password mysql --protocol=TCP -h 127.0.0.1 -u rental rental_operations_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7.4-alpine
        ports:
          - '16379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit and foundation tests
        run: npm test
      - name: MySQL and Redis integration tests
        run: npm run test:integration
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
